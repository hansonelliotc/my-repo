<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Exploring 2x2 Games</title>
	<link rel="stylesheet" href="game-theory-stylesheet.css">
	<!--<link rel="icon" type="image/x-icon" href="files/favicon.png">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Libre Baskerville">-->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
	<div style="position:absolute; top:4vh; left:100vh; width:22vw">
		<h1 id="quad-header">Bad Quadrant</h1>
		<table>
			<tr><td style="text-align:center"><b>Row Player (P1)</b></td><td style="text-align:center"><b>Column Player (P2)</b></td></tr>
			<tr height="3pt"></tr>
			<tr><td style="text-align:center" colspan="2">x,b</td></tr>
			<tr><td style="text-align:center"><span id="x-row"></span>, <span id="b-row"></span></td><td style="text-align:center"><span id="x-col"></span>, <span id="b-col"></span></td></tr>
			<tr height="3pt"></tr>
			<tr><td style="text-align:center" colspan="2">Returns (with mixed)</td></tr>
			<tr><td style="text-align:center"><span id="row-return"></span><span id="row-return-mixed"></span></td><td style="text-align:center"><span id="col-return"></span><span id="col-return-mixed"></span></td></tr>
			<tr height="3pt"></tr>
			<tr><td style="text-align:center" colspan="2">Shapley returns</td></tr>
			<tr><td style="text-align:center"><span id="row-return-transferable"></span></td><td style="text-align:center"><span id="col-return-transferable"></span></td></tr>
			<tr height="3pt"></tr>
			<tr><td style="text-align:center" colspan="2">Coco returns</td></tr>
			<tr><td style="text-align:center"><span id="row-return-coco"></span></td><td style="text-align:center"><span id="col-return-coco"></span></td></tr>
			<tr height="3pt"></tr>
			<tr><td style="text-align:center" colspan="2">Matrices</td></tr>
			<tr>
				<td style="text-align:center">
					<!-- <div style="display:flex;align-items:center;"> -->
					<!-- <div style="display:inline-block; margin-left:2vw">R =</div> -->
					<table style="border:2px solid;margin:10px;display:inline-block">
						<tr><td id="a1"></td><td id="b1"></td></tr>
						<tr><td id="c1"></td><td id="d1"></td></tr>
					</table>
					<!-- </div> -->
				</td>
				<td style="text-align:center">
					<!-- <div style="display:flex;align-items:center"> -->
					<!-- <div style="display:inline-block; margin-left:2vw">C =</div> -->
					<table style="border:2px solid;margin:10px;display:inline-block">
						<tr><td id="a2"></td><td id="b2"></td></tr>
						<tr><td id="c2"></td><td id="d2"></td></tr>
					</table>
					<!-- </div> -->
				</td>
			</td>
			</tr>
			<tr height="5vh" />
			<tr>
				<td><button id="cross-blue-1" onclick="crossBlue(true)" title="Flip the row player's biggest entries">Cross player one's blue</button></td>
				<td><button id="cross-blue-2" onclick="crossBlue(false)" title="Flip the column player's biggest entries">Cross player two's blue</button></td>
			</tr>
			<tr>
				<td><button id="cross-green-1" onclick="crossGreen(true)" title="Flip the row player's middle entries">Cross player one's green</button></td>
				<td><button id="cross-green-2" onclick="crossGreen(false)" title="Flip the column player's middle entries">Cross player two's green</button></td>
			</tr>
			<tr>
				<td><button id="cross-red-1" onclick="crossRed(true)" title="Flip the row player's smallest entries">Cross player one's red</button></td>
				<td><button id="cross-red-2" onclick="crossRed(false)" title="Flip the column player's smallest entries">Cross player two's red</button></td>
			</tr>
			<tr height="10vh" />
			<tr>
				<td><button id="cross-blue-1" onclick="wiggle(true)" title="Flip both the row player's smallest and their biggest entries">Wiggle player one</button></td>
				<td><button id="cross-blue-2" onclick="wiggle(false)" title="Flip both the column player's smallest and their biggest entries">Wiggle player two</button></td>
			</tr>
		</table>
		<br><br><br>
		<button class="mode-button current-mode" id="regular-mode" onclick="changeViewMode(0)">Regular view</button>
		<span><button class="half-mode-button" id="return-mode-2" onclick="changeViewMode(3)">Returns</button></span><span><button class="half-mode-button" id="return-mode-1" onclick="changeViewMode(1)">Use mixed</button></span>
		<span><button class="half-mode-button" id="transferable-mode" onclick="changeViewMode(2)">Shapley returns</button></span><span><button class="half-mode-button" id="coco-mode" onclick="changeViewMode(4)">Coco returns</button></span>
	</div>
	<svg id="big-picture" width="18vw" height="18vw" style="position:absolute; right:5%; top:5%">
		<rect x="0" y="0" width="100%" height="100%" fill="white" />
		<rect id="quad1" x="54%" y="4%" width="42%" height="42%" />
		<rect id="quad2" x="4%" y="4%" width="42%" height="42%" />
		<rect id="quad3" x="4%" y="54%" width="42%" height="42%" />
		<rect id="quad4" x="54%" y="54%" width="42%" height="42%" />
		<rect id="q1a" x="54%" y="25%" width="21%" height="21%" />
		<rect id="q2a" x="4%" y="25%" width="21%" height="21%" />
		<rect id="q2b" x="25%" y="25%" width="21%" height="21%" />
		<rect id="q3a" x="4%" y="54%" width="21%" height="21%" />
		<rect id="q3b" x="4%" y="75%" width="21%" height="21%" />
		<rect id="q3c" x="25%" y="75%" width="21%" height="21%" />
		<rect id="q4a" x="54%" y="54%" width="21%" height="21%" />
		<rect id="q4b" x="54%" y="75%" width="21%" height="21%" />

		<!-- quad1: thirds -->
		<line x1="68%" x2="68%" y1="4%" y2="46%" stroke="green" stroke-width="1%" />
		<line x1="82%" x2="82%" y1="4%" y2="46%" stroke="green" stroke-width="1%" />
		<line x1="54%" x2="96%" y1="18%" y2="18%" stroke="green" stroke-width="1%" />
		<line x1="54%" x2="96%" y1="32%" y2="32%" stroke="green" stroke-width="1%" />

		<!-- quad2: thirds -->
		<line x1="18%" x2="18%" y1="4%" y2="46%" stroke="green" stroke-width="1%" />
		<line x1="32%" x2="32%" y1="4%" y2="46%" stroke="green" stroke-width="1%" />
		<line x1="4%" x2="46%" y1="18%" y2="18%" stroke="green" stroke-width="1%" />
		<line x1="4%" x2="46%" y1="32%" y2="32%" stroke="green" stroke-width="1%" />

		<!-- quad3: thirds -->
		<line x1="18%" x2="18%" y1="54%" y2="96%" stroke="green" stroke-width="1%" />
		<line x1="32%" x2="32%" y1="54%" y2="96%" stroke="green" stroke-width="1%" />
		<line x1="4%" x2="46%" y1="68%" y2="68%" stroke="green" stroke-width="1%" />
		<line x1="4%" x2="46%" y1="82%" y2="82%" stroke="green" stroke-width="1%" />

		<!-- quad4: thirds -->
		<line x1="68%" x2="68%" y1="54%" y2="96%" stroke="green" stroke-width="1%" />
		<line x1="82%" x2="82%" y1="54%" y2="96%" stroke="green" stroke-width="1%" />
		<line x1="54%" x2="96%" y1="68%" y2="68%" stroke="green" stroke-width="1%" />
		<line x1="54%" x2="96%" y1="82%" y2="82%" stroke="green" stroke-width="1%" />

		<!-- quad1 frame -->
		<line x1="53.5%" x2="96.5%" y1="4%" y2="4%" stroke="green" stroke-width="1%" />
		<line x1="53.5%" x2="96.5%" y1="46%" y2="46%" stroke="green" stroke-width="1%" />
		<line x1="54%" x2="54%" y1="3.5%" y2="46.5%" stroke="green" stroke-width="1%" />
		<line x1="96%" x2="96%" y1="3.5%" y2="46.5%" stroke="green" stroke-width="1%" />

		<!-- quad2 frame -->
		<line x1="3.5%" x2="46.5%" y1="4%" y2="4%" stroke="green" stroke-width="1%" />
		<line x1="3.5%" x2="46.5%" y1="46%" y2="46%" stroke="green" stroke-width="1%" />
		<line x1="4%" x2="4%" y1="3.5%" y2="46.5%" stroke="green" stroke-width="1%" />
		<line x1="46%" x2="46%" y1="3.5%" y2="46.5%" stroke="green" stroke-width="1%" />

		<!-- quad3 frame -->
		<line x1="3.5%" x2="46.5%" y1="54%" y2="54%" stroke="green" stroke-width="1%" />
		<line x1="3.5%" x2="46.5%" y1="96%" y2="96%" stroke="green" stroke-width="1%" />
		<line x1="4%" x2="4%" y1="53.5%" y2="96.5%" stroke="green" stroke-width="1%" />
		<line x1="46%" x2="46%" y1="53.5%" y2="96.5%" stroke="green" stroke-width="1%" />

		<!-- quad4 frame -->
		<line x1="53.5%" x2="96.5%" y1="54%" y2="54%" stroke="green" stroke-width="1%" />
		<line x1="53.5%" x2="96.5%" y1="96%" y2="96%" stroke="green" stroke-width="1%" />
		<line x1="54%" x2="54%" y1="53.5%" y2="96.5%" stroke="green" stroke-width="1%" />
		<line x1="96%" x2="96%" y1="53.5%" y2="96.5%" stroke="green" stroke-width="1%" />

		<circle id="big-pic-point1" r="2%" cx="25%" cy="25%" fill="black" />
		<circle id="big-pic-point2" r="2%" cx="25%" cy="25%" fill="#888" />
		<circle id="big-pic-point3" r="2%" cx="25%" cy="25%" fill="#888" />
		<circle id="big-pic-point4" r="2%" cx="25%" cy="25%" fill="#888" />
		<circle id="big-pic-point5" r="2%" cx="25%" cy="25%" fill="#888" />
		<circle id="big-pic-point6" r="2%" cx="25%" cy="25%" fill="#888" />
		<circle id="big-pic-point7" r="2%" cx="25%" cy="25%" fill="#888" />
		<circle id="big-pic-point8" r="2%" cx="25%" cy="25%" fill="#888" />
		<circle id="big-pic-point9" r="2%" cx="25%" cy="25%" fill="#888" />
	</svg>
	<!-- <img src="files/fourFigureTables.png" width="20%" style="position:absolute; right:5%; top:40%"> -->
	<svg id="big-diagram" width="20vw" height="20vw" x="0" y="0" style="position:absolute; right:5%; top:50%">
		<line id="small-line-1"/>
		<line id="small-line-2"/>
		<line id="small-line-3"/>
		<line id="small-line-4"/>
		<line id="small-line-5"/>
		<line id="small-line-6"/>
		<line id="small-line-7"/>
		<line id="small-line-8"/>
		<line id="line2-big"/>
		<line id="line4-big"/>
		<line id="line1-big"/>
		<line id="line3-big"/>
		<circle id="corner1-big"/>
		<circle id="corner2-big"/>
		<circle id="corner3-big"/>
		<circle id="corner4-big"/>
		<circle id="point1-big"/>
		<circle id="point2-big"/>
		<circle id="point3-big"/>
		<circle id="point4-big"/>
		<circle id="point5-big"/>
		<text id="vertex-number-1" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="12" font-weight="bold" />
		<text id="vertex-number-2" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="12" font-weight="bold" />
		<text id="vertex-number-3" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="12" font-weight="bold" />
		<text id="vertex-number-4" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="12" font-weight="bold" />

		<line id="gold-bar-2"/>

	</svg>

	<div style="display: flex;">
		<svg id="container" width="80vh" height="80vh">
			<defs>
				<linearGradient id="gradient1" x1="0" x2="0.2" y1="0" y2="0.2" spreadMethod="repeat">
					<stop id="stop1" offset="0%" />
					<stop id="stop2" offset="50%" />
					<stop id="stop3" offset="100%" />
				</linearGradient>
				<linearGradient id="gradient2" x1="0" x2="0.2" y1="0" y2="0.2" spreadMethod="repeat">
					<stop id="stop4" offset="0%" />
					<stop id="stop5" offset="50%" />
					<stop id="stop6" offset="100%" />
				</linearGradient>
				<marker id="arrow" markerWidth="4" markerHeight="2" refX="1" refY="1" orient="auto-start-reverse">
					<path d="M 0 0 L 2 1 L 0 2 z" fill="black" />
				</marker><marker id="blue-arrow" markerWidth="4" markerHeight="2" refX="1" refY="1" orient="auto-start-reverse">
					<path d="M 0 0 L 2 1 L 0 2 z" fill="blue" />
				</marker>
			</defs>

			<svg id="arrows1">
				<line class="arrow" id="arrow1" />
				<line class="arrow" id="arrow2" />
				<line class="arrow" id="arrow3" />
				<line class="arrow" id="arrow4" />
				<line class="arrow" id="arrow5" />
				<line class="arrow" id="arrow6" />
			</svg>
			<svg id="arrows2">
				<line class="arrow" id="arrow7" />
				<line class="arrow" id="arrow8" />
				<line class="arrow" id="arrow9" />
				<line class="arrow" id="arrow10" />
				<line class="arrow" id="arrow11" />
				<line class="arrow" id="arrow12" />
			</svg>

			<svg id="whole-figure">
				<rect id="region1" />
				<rect id="region2" />
				<rect id="region3" />
				<rect id="region4" />
				<foreignObject id="canvasForeignObject" x="0" y="0" width="0" height="0"><canvas id="canvas"></canvas></foreignObject>
				<line class="red-line" id="red1" />
				<line class="red-line" id="red2" />
				<line class="red-line" id="red3" />
				<line class="red-line" id="red4" />
				<line class="red-line" id="red5" />
				<line class="red-line" id="red6" />
				<line class="green-line" id="green1" />
				<line class="green-line" id="green2" />
				<line class="green-line" id="green3" />
				<line class="green-line" id="green4" />
				<line class="green-line" id="green5" />
				<line class="green-line" id="green6" />
				<line class="green-line" id="green7" />
				<line class="green-line" id="green8" />
				<circle class="pic-corner" id="green-corner1" r="0.5%" />
				<circle class="pic-corner" id="green-corner2" r="0.5%" />
				<circle class="pic-corner" id="green-corner3" r="0.5%" />
				<circle class="pic-corner" id="green-corner4" r="0.5%" />
			</svg>

			<svg id="edge-figure">
				<line id="bar" class="edge-line" />
				<line id="bar1" class="edge-line" />
				<line id="bar2" class="edge-line" />
				<line id="bar3" class="edge-line" />
				<line id="bar4" class="edge-line" />
				<circle id="green-point1" fill="green" r="1%" />
				<circle id="green-point2" fill="green" r="1%" />
				<circle id="green-point3" fill="green" r="1%" />
				<circle id="green-point4" fill="green" r="1%" />
				<circle id="red-point1" fill="red" r="1%" />
				<circle id="red-point2" fill="red" r="1%" />
				<circle id="red-point3" fill="red" r="1%" />
			</svg>

			<svg id="diagram" width="11.43vh" height="11.43vh" x="0%" y="0%">
				<rect id="diagram-box" width="100%" height="100%" fill="gray" opacity="50%"/>
				<line id="line2"/>
				<line id="line4"/>
				<line id="line1"/>
				<line id="line3"/>
				<circle id="corner1"/>
				<circle id="corner2"/>
				<circle id="corner3"/>
				<circle id="corner4"/>
				<circle id="point1"/>
				<circle id="point2"/>
				<circle id="point3"/>
				<circle id="point4"/>
				<circle id="point5"/>
			</svg>
		</svg>

		<div style="display:flex;flex-direction:column;position:relative;">
			<input id="x2coord" type="range" min="0" max="6" step="0.01" value="3.5" style="writing-mode:vertical-lr;direction:rtl;">
			<div id="x2-label">x<sub>2</sub></div>
		</div>
		<div style="display:flex;flex-direction:column;position:relative;">
			<input id="b2coord" type="range" min="0" max="6" step="0.01" value="2" style="writing-mode:vertical-lr;direction:rtl;">
			<div id="b2-label">b<sub>2</sub></div>
		</div>
	</div>
	<div style="display:flex"><div id="x1-label">x<sub>1</sub></div>
	<input id="x1coord" type="range" min="0" max="6" step="0.01" value="3.5"></div>
	<div style="display:flex"><div id="b1-label">b<sub>1</sub></div>
	<input id="b1coord" type="range" min="0" max="6" step="0.01" value="2"></div>

</body>
